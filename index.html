<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WorkFlow - 個人用ワークマネージャー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b1120;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 16px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex justify-center bg-[#070b14]">
  <div id="app" class="w-full max-w-md min-h-screen bg-[#0f172a] flex flex-col relative shadow-2xl border-x border-slate-800/60">
    <!-- Header -->
    <header class="px-5 pt-5 pb-3 flex items-center justify-between border-b border-slate-800/80 bg-[#0f172a]/95 sticky top-0 z-20">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-cyan-400 shadow-lg shadow-indigo-500/20"></div>
        <div>
          <h1 id="header-title" class="text-lg font-bold tracking-tight text-white">ホーム</h1>
          <p id="header-date" class="text-xs text-slate-400"></p>
        </div>
      </div>
      <button onclick="openSettings()" class="w-9 h-9 rounded-full bg-slate-800/80 border border-slate-700/70 flex items-center justify-center text-slate-300 active:scale-95 transition">
        ⚙️
      </button>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="flex-1 overflow-y-auto px-4 pt-4 pb-24 space-y-4 no-scrollbar"></main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full max-w-md bg-[#0f172a]/95 backdrop-blur-md border-t border-slate-800/80 px-2 py-2 flex justify-around items-center z-20">
      <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center py-1 px-3 text-xs font-medium text-cyan-400">
        <span class="w-6 h-0.5 bg-cyan-400 rounded-full mb-1.5" id="ind-home"></span>
        <span>ホーム</span>
      </button>
      <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center py-1 px-3 text-xs font-medium text-slate-400">
        <span class="w-6 h-0.5 bg-transparent rounded-full mb-1.5" id="ind-tasks"></span>
        <span>タスク</span>
      </button>
      <button onclick="switchTab('leave')" id="nav-leave" class="flex flex-col items-center py-1 px-3 text-xs font-medium text-slate-400">
        <span class="w-6 h
