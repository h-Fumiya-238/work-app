<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 全画面アプリ化（standalone）を無効化し、通常のSafariブラウザ（サイト）として開く設定 -->
  <meta name="apple-mobile-web-app-capable" content="no">
  <meta name="mobile-web-app-capable" content="no">
  <title>WorkFlow - 個人用ワークマネージャー</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
          },
          colors: {
            slate: {
              850: '#162032',
              900: '#0f172a',
              950: '#080d1a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #080d1a;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .check-pop {
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .check-pop:active {
      transform: scale(0.85);
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1) opacity(0.7);
      cursor: pointer;
    }
  </style>
</head>
<body class="min-h-screen bg-[#080d1a] text-slate-100 antialiased selection:bg-sky-500/30 selection:text-sky-200">

  <!-- PC・タブレット・スマホ全対応レスポンシブコンテナ -->
  <div class="w-full max-w-5xl mx-auto min-h-screen bg-[#0f172a] lg:border-x lg:border-slate-800/80 flex flex-col relative shadow-2xl">

    <!-- ヘッダー（PCでは上部にナビゲーションも統合表示） -->
    <header class="sticky top-0 z-20 bg-[#0f172a]/90 backdrop-blur-md border-b border-slate-800/80 px-4 md:px-6 py-3.5 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-400 to-indigo-500 flex items-center justify-center shadow-lg shadow-sky-500/20 shrink-0">
          <i data-lucide="briefcase" class="w-4 h-4 text-slate-950 stroke-[2.5]"></i>
        </div>
        <div>
          <h1 id="header-title" class="text-base md:text-lg font-bold tracking-tight text-slate-100 leading-tight">ホーム</h1>
          <p id="header-date" class="text-[11px] md:text-xs text-slate-400 font-medium"></p>
        </div>
      </div>

      <!-- PC・タブレット用トップナビゲーション -->
      <nav class="hidden md:flex items-center gap-1.5 bg-slate-900/90 p-1 rounded-2xl border border-slate-800">
        <button onclick="switchTab('home')" id="pc-nav-home" class="pc-nav-btn px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 bg-slate-800 text-sky-400 transition">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          <span>ホーム</span>
        </button>
        <button onclick="switchTab('tasks')" id="pc-nav-tasks" class="pc-nav-btn px-4 py-2 rounded-xl text-xs font-medium flex items-center gap-2 text-slate-400 hover:text-slate-200 transition">
          <i data-lucide="check-square" class="w-4 h-4"></i>
          <span>タスク</span>
        </button>
        <button onclick="switchTab('leaves')" id="pc-nav-leaves" class="pc-nav-btn px-4 py-2 rounded-xl text-xs font-medium flex items-center gap-2 text-slate-400 hover:text-slate-200 transition">
          <i data-lucide="calendar-heart" class="w-4 h-4"></i>
          <span>休み管理</span>
        </button>
        <button onclick="switchTab('memos')" id="pc-nav-memos" class="pc-nav-btn px-4 py-2 rounded-xl text-xs font-medium flex items-center gap-2 text-slate-400 hover:text-slate-200 transition">
          <i data-lucide="sticky-note" class="w-4 h-4"></i>
          <span>メモ</span>
        </button>
      </nav>

      <div class="flex items-center gap-2">
        <button onclick="openDataModal()" class="p-2 md:px-3 md:py-2 rounded-xl bg-slate-800/70 hover:bg-slate-800 text-slate-300 transition flex items-center gap-1.5 text-xs font-medium" title="データ管理">
          <i data-lucide="settings" class="w-4 h-4"></i>
          <span class="hidden sm:inline">設定・バックアップ</span>
        </button>
      </div>
    </header>

    <!-- メインコンテンツ領域 -->
    <main id="main-content" class="flex-1 overflow-y-auto px-4 md:px-6 pt-5 pb-28 md:pb-12 space-y-6 no-scrollbar">
    </main>

    <!-- スマホ専用 下部固定ナビゲーションバー（md以上では非表示） -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 z-30 bg-[#162032]/95 backdrop-blur-lg border-t border-slate-800 pb-safe">
      <div class="grid grid-cols-4 h-16 max-w-lg mx-auto">
        <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center justify-center gap-1 text-sky-400 transition relative">
          <div class="nav-indicator absolute top-0 w-8 h-0.5 bg-sky-400 rounded-full transition-all"></div>
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          <span class="text-[10px] font-semibold">ホーム</span>
        </button>
        <button onclick="switchTab('tasks')" id="nav-tasks" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition relative">
          <div class="nav-indicator absolute top-0 w-8 h-0.5 bg-transparent rounded-full transition-all"></div>
          <i data-lucide="check-square" class="w-5 h-5"></i>
          <span class="text-[10px] font-medium">タスク</span>
        </button>
        <button onclick="switchTab('leaves')" id="nav-leaves" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition relative">
          <div class="nav-indicator absolute top-0 w-8 h-0.5 bg-transparent rounded-full transition-all"></div>
          <i data-lucide="calendar-heart" class="w-5 h-5"></i>
          <span class="text-[10px] font-medium">休み管理</span>
        </button>
        <button onclick="switchTab('memos')" id="nav-memos" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition relative">
          <div class="nav-indicator absolute top-0 w-8 h-0.5 bg-transparent rounded-full transition-all"></div>
          <i data-lucide="sticky-note" class="w-5 h-5"></i>
          <span class="text-[10px] font-medium">メモ</span>
        </button>
      </div>
    </nav>

    <!-- トースト通知 -->
    <div id="toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col items-center gap-2 w-full max-w-xs px-4"></div>

    <!-- カスタム確認・入力モーダル -->
    <div id="custom-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
      <div id="modal-box" class="bg-[#1e293b] border border-slate-700/80 rounded-2xl w-full max-w-md p-5 shadow-2xl transform transition-all">
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // 状態管理 & ローカルストレージ
    // ==========================================
    const STORAGE_KEY = 'workflow_personal_manager_v1';
    let currentTab = 'home';
    let currentTaskSubTab = 'spot'; // 'spot' | 'routine' (スマホ用切り替え)
    let currentMemoFilter = 'all';
    let currentLeaveViewMode = 'list'; // 'list' | 'calendar' (スマホ用切り替え)
    let calendarViewDate = new Date();

    function getOffsetDateStr(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatDisplayDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      return `${Number(parts[1])}/${Number(parts[2])}(${weekdays[d.getDay()]})`;
    }

    function getInitialSampleData() {
      return {
        spotTasks: [
          { id: 'sp-1', title: 'クライアントへ見積書を送付する', dueDate: getOffsetDateStr(0), priority: 'high', completed: false },
          { id: 'sp-2', title: '来週の定例ミーティング資料の作成', dueDate: getOffsetDateStr(2), priority: 'medium', completed: false },
          { id: 'sp-3', title: '経費精算の領収書アップロード', dueDate: getOffsetDateStr(5), priority: 'low', completed: false }
        ],
        routineTasks: [
          { id: 'rt-1', title: '朝一番のメール・チャット確認＆返信', frequency: '毎日', completed: true },
          { id: 'rt-2', title: '日報の提出と明日のタスク整理', frequency: '毎日', completed: false },
          { id: 'rt-3', title: '週次進捗レポートの提出', frequency: '毎週金曜', completed: false }
        ],
        totalPaidLeaveDays: 20,
        leaves: [
          { id: 'lv-1', date: getOffsetDateStr(10), type: '有給休暇', days: 1.0, memo: 'リフレッシュ休暇' },
          { id: 'lv-2', date: getOffsetDateStr(-12), type: '半休（午前）', days: 0.5, memo: '通院のため' },
          { id: 'lv-3', date: getOffsetDateStr(-28), type: '有給休暇', days: 1.0, memo: '私用' }
        ],
        memos: [
          { id: 'mm-1', tag: 'アイデア', content: '定例会議の事前アジェンダ共有を前日17時までに固定すると、当日の議論がスムーズになりそう。', updatedAt: '今日 09:30' },
          { id: 'mm-2', tag: '会議', content: '田中さん確認事項：来期のツール導入予算について、来週火曜までに概算を共有する。', updatedAt: '昨日 16:45' },
          { id: 'mm-3', tag: '雑記', content: '新しいモニターアームの高さ調整がちょうど良い。', updatedAt: '3日前' }
        ]
      };
    }

    let appState = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            spotTasks: Array.isArray(parsed.spotTasks) ? parsed.spotTasks : [],
            routineTasks: Array.isArray(parsed.routineTasks) ? parsed.routineTasks : [],
            totalPaidLeaveDays: typeof parsed.totalPaidLeaveDays === 'number' ? parsed.totalPaidLeaveDays : 20,
            leaves: Array.isArray(parsed.leaves) ? parsed.leaves : [],
            memos: Array.isArray(parsed.memos) ? parsed.memos : []
          };
        }
      } catch (e) {
        console.error('Load error:', e);
      }
      const initial = getInitialSampleData();
      saveState(initial);
      return initial;
    }

    function saveState(stateToSave = appState) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stateToSave));
      } catch (e) {
        console.error('Save error:', e);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = 'bg-slate-800/95 border border-sky-500/40 text-slate-100 text-xs font-medium px-4 py-2.5 rounded-full shadow-xl backdrop-blur-md flex items-center gap-2 transition-all duration-300 opacity-0 translate-y-[-8px]';
      el.innerHTML = `<span class="w-2 h-2 rounded-full bg-sky-400"></span><span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      requestAnimationFrame(() => {
        el.classList.remove('opacity-0', 'translate-y-[-8px]');
      });
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-[-8px]');
        setTimeout(() => el.remove(), 300);
      }, 2200);
    }

    function openModal(htmlContent) {
      const modal = document.getElementById('custom-modal');
      const box = document.getElementById('modal-box');
      box.innerHTML = htmlContent;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      if (window.lucide) lucide.createIcons();
    }

    function closeModal() {
      const modal = document.getElementById('custom-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    document.getElementById('custom-modal').addEventListener('click', (e) => {
      if (e.target.id === 'custom-modal') closeModal();
    });

    // ==========================================
    // ナビゲーション制御（スマホ下部＆PC上部同期）
    // ==========================================
    function switchTab(tabName) {
      currentTab = tabName;

      // スマホ用下部ナビ更新
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-sky-400', 'font-semibold');
        btn.classList.add('text-slate-400');
        const indicator = btn.querySelector('.nav-indicator');
        if (indicator) {
          indicator.classList.remove('bg-sky-400');
          indicator.classList.add('bg-transparent');
        }
      });
      const activeBtn = document.getElementById(`nav-${tabName}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-400');
        activeBtn.classList.add('text-sky-400', 'font-semibold');
        const indicator = activeBtn.querySelector('.nav-indicator');
        if (indicator) {
          indicator.classList.remove('bg-transparent');
          indicator.classList.add('bg-sky-400');
        }
      }

      // PC用上部ナビ更新
      document.querySelectorAll('.pc-nav-btn').forEach(btn => {
        btn.classList.remove('bg-slate-800', 'text-sky-400', 'font-bold', 'shadow-sm');
        btn.classList.add('text-slate-400', 'font-medium');
      });
      const activePcBtn = document.getElementById(`pc-nav-${tabName}`);
      if (activePcBtn) {
        activePcBtn.classList.remove('text-slate-400', 'font-medium');
        activePcBtn.classList.add('bg-slate-800', 'text-sky-400', 'font-bold', 'shadow-sm');
      }

      const titles = {
        home: 'ホーム',
        tasks: 'タスク管理',
        leaves: '休み・有給管理',
        memos: 'クイックメモ'
      };
      document.getElementById('header-title').textContent = titles[tabName] || 'WorkFlow';
      renderCurrentView();
    }

    function updateHeaderDate() {
      const now = new Date();
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      const str = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 (${weekdays[now.getDay()]})`;
      document.getElementById('header-date').textContent = str;
    }

    function renderCurrentView() {
      const main = document.getElementById('main-content');
      if (currentTab === 'home') {
        main.innerHTML = renderHomeView();
      } else if (currentTab === 'tasks') {
        main.innerHTML = renderTasksView();
      } else if (currentTab === 'leaves') {
        main.innerHTML = renderLeavesView();
      } else if (currentTab === 'memos') {
        main.innerHTML = renderMemosView();
      }
      if (window.lucide) lucide.createIcons();
    }

    // ==========================================
    // 1. ホーム画面レンダリング（PCでは2カラムワイド展開）
    // ==========================================
    function renderHomeView() {
      const todayStr = getOffsetDateStr(0);

      const usedPaidDays = appState.leaves
        .filter(l => l.type.includes('有給') || l.type.includes('半休'))
        .reduce((sum, l) => sum + Number(l.days || 0), 0);
      const remainingPaidDays = Math.max(0, (appState.totalPaidLeaveDays - usedPaidDays)).toFixed(1).replace(/\.0$/, '');

      const upcomingLeaves = appState.leaves
        .filter(l => l.date >= todayStr)
        .sort((a, b) => a.date.localeCompare(b.date));
      const nextLeave = upcomingLeaves[0];

      const pendingSpotTasks = appState.spotTasks
        .filter(t => !t.completed)
        .sort((a, b) => (a.dueDate || '9999-99-99').localeCompare(b.dueDate || '9999-99-99'));

      const pendingRoutineCount = appState.routineTasks.filter(t => !t.completed).length;

      return `
        <!-- サマリーカード（スマホ2列 / PC3列） -->
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4">
          <div onclick="switchTab('tasks')" class="bg-[#1e293b]/90 border border-slate-800 rounded-2xl p-4 cursor-pointer hover:border-sky-500/40 transition active:scale-[0.98]">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-medium text-slate-400">残っているタスク</span>
              <div class="w-8 h-8 rounded-lg bg-sky-500/15 text-sky-400 flex items-center justify-center">
                <i data-lucide="list-todo" class="w-4 h-4"></i>
              </div>
            </div>
            <div class="flex items-baseline gap-1.5">
              <span class="text-2xl md:text-3xl font-bold text-slate-100">${pendingSpotTasks.length + pendingRoutineCount}</span>
              <span class="text-xs text-slate-400">件</span>
            </div>
            <p class="text-[11px] text-slate-400 mt-1">変動 ${pendingSpotTasks.length}件 / 定期 ${pendingRoutineCount}件</p>
          </div>

          <div onclick="switchTab('leaves')" class="bg-[#1e293b]/90 border border-slate-800 rounded-2xl p-4 cursor-pointer hover:border-emerald-500/40 transition active:scale-[0.98]">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-medium text-slate-400">有給残日数</span>
              <div class="w-8 h-8 rounded-lg bg-emerald-500/15 text-emerald-400 flex items-center justify-center">
                <i data-lucide="sun" class="w-4 h-4"></i>
              </div>
            </div>
            <div class="flex items-baseline gap-1">
              <span class="text-2xl md:text-3xl font-bold text-emerald-400">${remainingPaidDays}</span>
              <span class="text-xs text-slate-400">日</span>
            </div>
            <p class="text-[11px] text-slate-400 mt-1 truncate">
              ${nextLeave ? `次の休み: ${formatDisplayDate(nextLeave.date)}` : '予定されている休みなし'}
            </p>
          </div>

          <div onclick="switchTab('memos')" class="col-span-2 md:col-span-1 bg-[#1e293b]/90 border border-slate-800 rounded-2xl p-4 cursor-pointer hover:border-indigo-500/40 transition active:scale-[0.98]">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-medium text-slate-400">クイックメモ</span>
              <div class="w-8 h-8 rounded-lg bg-indigo-500/15 text-indigo-400 flex items-center justify-center">
                <i data-lucide="sticky-note" class="w-4 h-4"></i>
              </div>
            </div>
            <div class="flex items-baseline gap-1.5">
              <span class="text-2xl md:text-3xl font-bold text-indigo-300">${appState.memos.length}</span>
              <span class="text-xs text-slate-400">件のメモ</span>
            </div>
            <p class="text-[11px] text-slate-400 mt-1 truncate">
              ${appState.memos[0] ? escapeHtml(appState.memos[0].content) : 'メモを追加して整理しよう'}
            </p>
          </div>
        </div>

        <!-- クイック変動タスク追加バー -->
        <form onsubmit="handleQuickAddSpotTask(event)" class="bg-[#1e293b]/80 border border-slate-800 rounded-2xl p-3 flex items-center gap-2 shadow-sm">
          <input type="text" id="quick-spot-input" placeholder="変動タスクを素早く追加..." required
            class="flex-1 bg-transparent text-sm text-slate-100 placeholder-slate-500 focus:outline-none px-2">
          <button type="submit" class="bg-sky-400 hover:bg-sky-300 active:scale-95 text-slate-950 font-semibold text-xs px-4 py-2.5 rounded-xl transition flex items-center gap-1 shrink-0">
            <i data-lucide="plus" class="w-3.5 h-3.5 stroke-[2.5]"></i>
            <span>追加</span>
          </button>
        </form>

        <!-- PCでは左右2カラムで並列表示、スマホでは縦並び -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
          <!-- 今日のルーティン（決まっているタスク） -->
          <section class="space-y-2.5">
            <div class="flex items-center justify-between px-0.5">
              <div class="flex items-center gap-2">
                <i data-lucide="repeat" class="w-4 h-4 text-indigo-400"></i>
                <h2 class="text-sm font-bold text-slate-200">決まっているタスク</h2>
              </div>
              <button onclick="resetAllRoutineTasks()" class="text-[11px] text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1 px-2 py-1 rounded-lg hover:bg-indigo-500/10 transition">
                <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
                <span>一括リセット</span>
              </button>
            </div>
            <div class="space-y-2">
              ${appState.routineTasks.length > 0 ? appState.routineTasks.map(task => renderRoutineTaskItem(task, false)).join('') : `
                <div class="text-center py-6 bg-slate-900/50 rounded-2xl border border-slate-800/60 text-xs text-slate-500">
                  定期タスクはありません
                </div>
              `}
            </div>
          </section>

          <!-- 優先・直近の変動タスク -->
          <section class="space-y-2.5">
            <div class="flex items-center justify-between px-0.5">
              <div class="flex items-center gap-2">
                <i data-lucide="zap" class="w-4 h-4 text-amber-400"></i>
                <h2 class="text-sm font-bold text-slate-200">直近の変動タスク</h2>
              </div>
              <button onclick="switchTab('tasks')" class="text-[11px] text-sky-400 hover:text-sky-300 font-medium">すべて見る →</button>
            </div>
            <div class="space-y-2">

    // ==========================================
    // 2. タスク管理画面レンダリング（PCでは左右2カラム同時表示）
    // ==========================================

      currentTaskSubTab = sub;
      renderCurrentView();
    }

    function handleRoutineFreqChange(selectEl) {
      const customInput = document.getElementById('routine-custom-freq');
      if (!customInput) return;
      if (selectEl.value === '__custom__') {
        customInput.classList.remove('hidden');
        customInput.required = true;
        customInput.focus();
      } else {
        customInput.classList.add('hidden');
        customInput.required = false;
      }
    }

    function renderTasksView() {
      const isSpot = currentTaskSubTab === 'spot';
      const sortedSpotTasks = [...appState.spotTasks].sort((a, b) => {
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        return (a.dueDate || '9999-99-99').localeCompare(b.dueDate || '9999-99-99');

      const spotSectionHtml = `
        <div class="space-y-3">
          <div class="hidden md:flex items-center gap-2 px-1">

      const routineSectionHtml = `

            <i data-lucide="repeat" class="w-4 h-4 text-indigo-400"></i>
            <h2 class="text-sm font-bold text-slate-200">決まっているタスク (${appState.routineTasks.length}件)</h2>
          </div>

          <form onsubmit="handleAddRoutineTask(event)" class="bg-[#1e293b]/90 border border-slate-800 rounded-2xl p-3.5 space-y-3 shadow-sm">

    function renderSpotTaskItem(task, showDelete = false) {
      const todayStr = getOffsetDateStr(0);
      const isOverdue = !task.completed && task.dueDate && task.dueDate < todayStr;
      const isToday = !task.completed && task.dueDate === todayStr;

      const priorityBadge = {
        high: '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-rose-500/15 text-rose-400 border border-rose-500/20">高</span>',
        medium: '<span class="px-1.5 py-0.5 rounded text-[10px] font-medium bg-amber-500/15 text-amber-300 border border-amber-500/20">中</span>',
        low: '<span class="px-1.5 py-0.5 rounded text-[10px] font-medium bg-slate-700/60 text-slate-400">低</span>'
      }[task.priority || 'medium'];

      return `
        <div class="bg-[#1e293b]/80 border ${task.completed ? 'border-slate-800/60 opacity-60' : 'border-slate-700/70'} rounded-2xl p-3 flex items-center gap-3 transition">
          <button onclick="toggleSpotTask('${task.id}')" class="check-pop w-6 h-6 rounded-lg border-2 flex items-center justify-center shrink-0 transition ${task.completed ? 'bg-sky-400 border-sky-400 text-slate-950' : 'border-slate-600 hover:border-sky-400'}">
            ${task.completed ? '<i data-lucide="check" class="w-4 h-4 stroke-[3]"></i>' : ''}
          </button>
          <div class="flex-1 min-w-0">
            <p class="text-sm break-words ${task.completed ? 'line-through text-slate-500' : 'text-slate-100 font-medium'}">${escapeHtml(task.title)}</p>
            <div class="flex items-center gap-2 mt-1 flex-wrap">
              ${priorityBadge}
              ${task.dueDate ? `
                <span class="text-[11px] flex items-center gap-1 ${isOverdue ? 'text-rose-400 font-semibold' : isToday ? 'text-sky-400 font-semibold' : 'text-slate-400'}">
                  <i data-lucide="calendar" class="w-3 h-3"></i>
                  ${formatDisplayDate(task.dueDate)}${isOverdue ? ' (期限切れ)' : isToday ? ' (今日)' : ''}
                </span>
              ` : ''}
            </div>
          </div>
          <div class="flex items-center gap-0.5 shrink-0">
            <button onclick="openCalendarSyncModal('spot', '${task.id}')" class="p-1.5 text-slate-400 hover:text-emerald-400 rounded-lg hover:bg-slate-800 transition" title="カレンダー連携">
              <i data-lucide="calendar-plus" class="w-4 h-4"></i>
            </button>
            ${showDelete ? `
              <button onclick="deleteSpotTask('${task.id}')" class="p-1.5 text-slate-400 hover:text-rose-400 rounded-lg hover:bg-slate-800 transition" title="削除">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }

    function renderRoutineTaskItem(task, showDelete = false) {
      return `
        <div class="bg-[#1e293b]/80 border ${task.completed ? 'border-slate-800/60 opacity-75' : 'border-slate-700/70'} rounded-2xl p-3 flex items-center gap-3 transition">
          <button onclick="toggleRoutineTask('${task.id}')" class="check-pop w-6 h-6 rounded-lg border-2 flex items-center justify-center shrink-0 transition ${task.completed ? 'bg-indigo-500 border-indigo-500 text-white' : 'border-slate-600 hover:border-indigo-400'}">
            ${task.completed ? '<i data-lucide="check" class="w-4 h-4 stroke-[3]"></i>' : ''}
          </button>
          <div class="flex-1 min-w-0">
            <p class="text-sm break-words ${task.completed ? 'line-through text-slate-500' : 'text-slate-100 font-medium'}">${escapeHtml(task.title)}</p>
          </div>
          <span class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-indigo-500/15 text-indigo-300 border border-indigo-500/20 shrink-0">${escapeHtml(task.frequency)}</span>

            ${showDelete ? `

                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }

    function renderMiniScheduleCalendar() {
      const year = calendarViewDate.getFullYear();
      const month = calendarViewDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = getOffsetDateStr(0);
      const weekHeaders = ['日', '月', '火', '水', '木', '金', '土'];

      let cellsHtml = '';
      for (let i = 0; i < firstDay; i++) {
        cellsHtml += `<div class="h-14 md:h-16 rounded-xl bg-slate-900/30"></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayLeaves = appState.leaves.filter(l => l.date === dateStr);
        const dayTasks = appState.spotTasks.filter(t => t.dueDate === dateStr && !t.completed);
        const isToday = dateStr === todayStr;

        cellsHtml += `
          <div class="h-14 md:h-16 rounded-xl p-1 flex flex-col justify-between border ${isToday ? 'border-sky-400 bg-sky-500/10' : dayLeaves.length > 0 ? 'border-emerald-500/40 bg-emerald-500/10' : 'border-slate-800/80 bg-slate-900/60'}">
            <span class="text-[11px] font-bold ${isToday ? 'text-sky-300' : 'text-slate-300'} leading-none">${d}</span>
            <div class="space-y-0.5 overflow-hidden">
              ${dayLeaves.length > 0 ? `<div class="text-[9px] font-bold px-1 rounded bg-emerald-500/30 text-emerald-200 truncate">休</div>` : ''}
              ${dayTasks.length > 0 ? `<div class="text-[9px] font-bold px-1 rounded bg-amber-500/30 text-amber-200 truncate">残${dayTasks.length}</div>` : ''}
            </div>
          </div>
        `;
      }

      const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      const monthLeaves = appState.leaves.filter(l => l.date.startsWith(monthPrefix)).sort((a, b) => a.date.localeCompare(b.date));
      const monthTasks = appState.spotTasks.filter(t => t.dueDate && t.dueDate.startsWith(monthPrefix) && !t.completed).sort((a, b) => a.dueDate.localeCompare(b.dueDate));

      return `
        <div class="bg-[#1e293b]/90 border border-slate-800 rounded-2xl p-3.5 space-y-3">
          <div class="flex items-center justify-between">
            <button onclick="changeCalendarMonth(-1)" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <h3 class="text-sm font-bold text-slate-100">${year}年 ${month + 1}月</h3>
            <button onclick="changeCalendarMonth(1)" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="grid grid-cols-7 gap-1 text-center">
            ${weekHeaders.map((w, idx) => `<span class="text-[10px] font-bold ${idx === 0 ? 'text-rose-400' : idx === 6 ? 'text-sky-400' : 'text-slate-400'}">${w}</span>`).join('')}
          </div>
          <div class="grid grid-cols-7 gap-1">
            ${cellsHtml}
          </div>
          <div class="flex items-center justify-end gap-3 text-[10px] text-slate-400 pt-1">
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400"></span>休み予定</span>
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-400"></span>変動タスク期限</span>
          </div>
        </div>

        <div class="space-y-2">
          <h4 class="text-xs font-semibold text-slate-400 px-1">${month + 1}月の予定サマリー</h4>
          ${monthLeaves.length === 0 && monthTasks.length === 0 ? `
            <div class="text-center py-5 text-xs text-slate-500 bg-slate-900/40 rounded-2xl border border-slate-800/60">この月の予定はありません</div>
          ` : `
            ${monthLeaves.map(l => `
              <div class="bg-[#1e293b]/70 border border-emerald-500/25 rounded-xl px-3 py-2.5 flex items-center justify-between text-xs">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="font-bold text-emerald-400 shrink-0">${formatDisplayDate(l.date)}</span>
                  <span class="text-slate-100 font-medium truncate">${escapeHtml(l.type)} ${l.memo ? `(${escapeHtml(l.memo)})` : ''}</span>
                </div>
                <button onclick="openCalendarSyncModal('leave', '${l.id}')" class="text-emerald-400 hover:text-emerald-300 p-1 shrink-0" title="外部カレンダーへ送る">
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            `).join('')}
            ${monthTasks.map(t => `
              <div class="bg-[#1e293b]/70 border border-amber-500/25 rounded-xl px-3 py-2.5 flex items-center justify-between text-xs">
                <div class="flex items-center gap-2 min-w-0">

    function getCalendarItemPayload(category, id) {
      if (category === 'spot') {
        const task = appState.spotTasks.find(t => t.id === id);
        if (!task) return null;
        const pLabel = { high: '高', medium: '中', low: '低' }[task.priority || 'medium'];
        return {
          title: `【仕事】${task.title}`,
          dateStr: task.dueDate || getOffsetDateStr(0),
          details: `WorkFlow 変動タスク（優先度: ${pLabel}）`,
          rrule: ''
        };
      } else if (category === 'leave') {
        const leave = appState.leaves.find(l => l.id === id);
        if (!leave) return null;
        return {
          title: `【休み】${leave.type}`,
          dateStr: leave.date || getOffsetDateStr(0),
          details: leave.memo ? `メモ: ${leave.memo}` : 'WorkFlow 休暇予定',
          rrule: ''
        };
      } else if (category === 'routine') {
        const rt = appState.routineTasks.find(t => t.id === id);
        if (!rt) return null;
        const freqMap = {
          '毎日': 'RRULE:FREQ=DAILY',
          '平日のみ': 'RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR',
          '隔週': 'RRULE:FREQ=WEEKLY;INTERVAL=2',
          '毎週月曜': 'RRULE:FREQ=WEEKLY;BYDAY=MO',
          '毎週火曜': 'RRULE:FREQ=WEEKLY;BYDAY=TU',
          '毎週水曜': 'RRULE:FREQ=WEEKLY;BYDAY=WE',
          '毎週木曜': 'RRULE:FREQ=WEEKLY;BYDAY=TH',
          '毎週金曜': 'RRULE:FREQ=WEEKLY;BYDAY=FR',
          '毎週土曜': 'RRULE:FREQ=WEEKLY;BYDAY=SA',
          '毎週日曜': 'RRULE:FREQ=WEEKLY;BYDAY=SU',
          '毎月1日': 'RRULE:FREQ=MONTHLY;BYMONTHDAY=1',
          '毎月15日': 'RRULE:FREQ=MONTHLY;BYMONTHDAY=15',
          '毎月25日': 'RRULE:FREQ=MONTHLY;BYMONTHDAY=25',
          '月末': 'RRULE:FREQ=MONTHLY;BYMONTHDAY=-1'
        };
        return {
          title: `【ルーティン】${rt.title}`,
          dateStr: getOffsetDateStr(0),
          details: `WorkFlow 決まっているタスク（頻度: ${rt.frequency}）`,
          rrule: freqMap[rt.frequency] || ''
        };
      }
      return null;
    }

    function launchGoogleCalendar(category, id) {
      const payload = getCalendarItemPayload(category, id);
      if (!payload) return;

      const startCompact = payload.dateStr.replace(/-/g, '');
      const nextDayObj = new Date(payload.dateStr + 'T00:00:00');
      nextDayObj.setDate(nextDayObj.getDate() + 1);
      const endCompact = `${nextDayObj.getFullYear()}${String(nextDayObj.getMonth() + 1).padStart(2, '0')}${String(nextDayObj.getDate()).padStart(2, '0')}`;

      let url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(payload.title)}&dates=${startCompact}/${endCompact}&details=${encodeURIComponent(payload.details)}`;
      if (payload.rrule) {
        url += `&recur=${encodeURIComponent(payload.rrule)}`;
      }
      closeModal();
      window.open(url, '_blank', 'noopener');
    }

    function downloadIcsEvent(category, id) {
      const payload = getCalendarItemPayload(category, id);
      if (!payload) return;

      const startCompact = payload.dateStr.replace(/-/g, '');
      const nextDayObj = new Date(payload.dateStr + 'T00:00:00');
      nextDayObj.setDate(nextDayObj.getDate() + 1);
      const endCompact = `${nextDayObj.getFullYear()}${String(nextDayObj.getMonth() + 1).padStart(2, '0')}${String(nextDayObj.getDate()).padStart(2, '0')}`;
      const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

      const lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//WorkFlow//Personal Manager//JP',
        'BEGIN:VEVENT',
        `UID:${Date.now()}@workflow.local`,
        `DTSTAMP:${stamp}`,
        `DTSTART;VALUE=DATE:${startCompact}`,
        `DTEND;VALUE=DATE:${endCompact}`,
        `SUMMARY:${payload.title}`,
        `DESCRIPTION:${payload.details}`
      ];
      if (payload.rrule) {
        lines.push(payload.rrule);
      }
      lines.push('END:VEVENT', 'END:VCALENDAR');

      const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `workflow_event_${startCompact}.ics`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      closeModal();
      showToast('カレンダー登録用ファイル(.ics)を作成しました');
    }

      saveState();
      renderCurrentView();
      showToast('メモを保存しました');
    }

    function deleteMemo(id) {
      appState.memos = appState.memos.filter(m => m.id !== id);
      saveState();
      renderCurrentView();
      showToast('メモを削除しました');
    }

    function convertMemoToTask(id) {
      const memo = appState.memos.find(m => m.id === id);
      if (!memo) return;
      appState.spotTasks.unshift({
        id: 'sp-' + Date.now(),
        title: memo.content.length > 50 ? memo.content.slice(0, 50) + '...' : memo.content,
        dueDate: getOffsetDateStr(1),
        priority: 'medium',
        completed: false
      });
      saveState();
      showToast('変動タスクに追加しました！');
    }

    // ==========================================
    // データ管理モーダル（バックアップ・初期化）
    // ==========================================
    function openDataModal() {
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="database" class="w-4 h-4 text-sky-400"></i>
              <h3 class="text-base font-bold text-slate-100">データ管理・バックアップ</h3>
            </div>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <p class="text-xs text-slate-400 leading-relaxed">
            すべてのデータはブラウザ内に自動保存されています。別端末へ移行する場合は以下のバックアップ文字列をコピーしてください。
          </p>
          <div class="space-y-2">
            <button onclick="copyBackupData()" class="w-full py-2.5 px-3 rounded-xl text-xs font-semibold text-slate-200 bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center gap-2 transition">
              <i data-lucide="copy" class="w-3.5 h-3.5 text-sky-400"></i>
              <span>バックアップ文字をコピー</span>
            </button>
            <button onclick="showImportArea()" class="w-full py-2.5 px-3 rounded-xl text-xs font-semibold text-slate-200 bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center gap-2 transition">
              <i data-lucide="download" class="w-3.5 h-3.5 text-emerald-400"></i>
              <span>バックアップ文字から復元</span>
            </button>
          </div>
          <div id="import-area" class="hidden space-y-2 pt-2 border-t border-slate-800">
            <textarea id="import-json-input" rows="3" placeholder="コピーしたデータをここに貼り付け..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-sky-400"></textarea>
            <button onclick="executeImportData()" class="w-full py-2 rounded-xl text-xs font-bold text-slate-950 bg-emerald-400 hover:bg-emerald-300">データを上書き復元する</button>
          </div>
          <div class="pt-2 border-t border-slate-800">
            <button onclick="resetToSampleData()" class="w-full py-2 px-3 rounded-xl text-xs font-medium text-rose-400 hover:bg-rose-500/10 transition">
              初期サンプルデータに戻す
            </button>
          </div>
        </div>
      `);
    }

    function copyBackupData() {
      const str = JSON.stringify(appState);
      navigator.clipboard.writeText(str).then(() => {
        showToast('バックアップデータをコピーしました');
      }).catch(() => {
        showToast('コピーに失敗しました');
      });
    }

    function showImportArea() {
      document.getElementById('import-area').classList.remove('hidden');
    }

    function executeImportData() {
      try {
        const raw = document.getElementById('import-json-input').value.trim();
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.spotTasks)) {
          appState = parsed;
          saveState();
          closeModal();
          renderCurrentView();
          showToast('データを復元しました');
        } else {
          showToast('データ形式が正しくありません');
        }
      } catch (e) {
        showToast('データの読み込みに失敗しました');
      }
    }

    function resetToSampleData() {
      appState = getInitialSampleData();
      saveState();
      closeModal();
      renderCurrentView();
      showToast('初期サンプルデータに戻しました');
    }

    // 初期化実行
    updateHeaderDate();
    renderCurrentView();
  </script>
</body>
</html>
