<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WorkFlow - 個人用ワークマネージャー</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
          },
          colors: {
            slate: {
              850: '#162032',
              900: '#0f172a',
              950: '#080d1a',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* カスタムスクロールバー＆モバイル最適化 */
    body {
      background-color: #080d1a;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* チェックボックスアニメーション */
    .check-pop {
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .check-pop:active {
      transform: scale(0.85);
    }
    /* セーフエリア対応 */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    /* カレンダーアイコンの色反転（ダークモード用） */
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1) opacity(0.7);
      cursor: pointer;
    }
  </style>
</head>
<body class="min-h-screen flex justify-center bg-[#080d1a] text-slate-100 antialiased selection:bg-sky-500/30 selection:text-sky-200">

  <!-- アプリ全体コンテナ（スマホ幅最適化・PCでは中央に美しいフレーム表示） -->
  <div class="w-full max-w-md min-h-screen bg-[#0f172a] sm:border-x sm:border-slate-800/80 flex flex-col relative shadow-2xl">

    <!-- ヘッダー -->
    <header class="sticky top-0 z-20 bg-[#0f172a]/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-sky-400 to-indigo-500 flex items-center justify-center shadow-lg shadow-sky-500/20">
          <i data-lucide="briefcase" class="w-4 h-4 text-slate-950 stroke-[2.5]"></i>
        </div>
        <div>
          <h1 id="header-title" class="text-base font-bold tracking-tight text-slate-100 leading-tight">ホーム</h1>
          <p id="header-date" class="text-[11px] text-slate-400 font-medium"></p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openDataModal()" class="p-2 rounded-xl bg-slate-800/70 hover:bg-slate-800 text-slate-300 transition" title="データ管理">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- メインコンテンツ領域 -->
    <main id="main-content" class="flex-1 overflow-y-auto px-4 pt-4 pb-28 space-y-5 no-scrollbar">
      <!-- JavaScriptでアクティブなタブの画面をレンダリング -->
    </main>

    <!-- 下部固定ナビゲーションバー（4タブ） -->
    <nav class="fixed bottom-0 w-full max-w-md z-30 bg-[#162032]/95 backdrop-blur-lg border-t border-slate-800 pb-safe">
      <div class="grid grid-cols-4 h-16">
        <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center justify-center gap-1 text-sky-400 transition relative">
          <div class="nav-indicator absolute top-0 w-8 h-0.5 bg-sky-400 rounded-full transition-all"></div>
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          <span class="text-[10px] font-semibold">ホーム</span>
        </button>
        <button onclick="switchTab('tasks')" id="nav-tasks" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition relative">
          <div class="nav-indicator absolute top-0 w-8 h-0.5 bg-transparent rounded-full transition-all"></div>
          <i data-lucide="check-square" class="w-5 h-5"></i>
          <span class="text-[10px] font-medium">タスク</span>
        </button>
        <button onclick="switchTab('leaves')" id="nav-leaves" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition relative">
          <div class="nav-indicator absolute top-0 w-8 h-0.5 bg-transparent rounded-full transition-all"></div>
          <i data-lucide="calendar-heart" class="w-5 h-5"></i>
          <span class="text-[10px] font-medium">休み管理</span>
        </button>
        <button onclick="switchTab('memos')" id="nav-memos" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition relative">
          <div class="nav-indicator absolute top-0 w-8 h-0.5 bg-transparent rounded-full transition-all"></div>
          <i data-lucide="sticky-note" class="w-5 h-5"></i>
          <span class="text-[10px] font-medium">メモ</span>
        </button>
      </div>
    </nav>

    <!-- トースト通知 -->
    <div id="toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col items-center gap-2 w-full max-w-xs px-4"></div>

    <!-- カスタム確認・入力モーダル -->
    <div id="custom-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
      <div id="modal-box" class="bg-[#1e293b] border border-slate-700/80 rounded-2xl w-full max-w-sm p-5 shadow-2xl transform transition-all">
        <!-- モーダル中身はJSで注入 -->
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // 状態管理 & ローカルストレージ
    // ==========================================
    const STORAGE_KEY = 'workflow_personal_manager_v1';
    let currentTab = 'home';
    let currentTaskSubTab = 'spot'; // 'spot' | 'routine'
    let currentMemoFilter = 'all';
    let currentLeaveViewMode = 'list'; // 'list' | 'calendar'
    let calendarViewDate = new Date();

    // 日付ヘルパー（今日を基準としたYYYY-MM-DD文字列を取得）
// ... existing code ... -->
    function renderRoutineTaskItem(task, showDelete = false) {
      return `
        <div class="bg-[#1e293b]/80 border ${task.completed ? 'border-slate-800/60 opacity-75' : 'border-slate-700/70'} rounded-2xl p-3 flex items-center gap-3 transition">
          <button onclick="toggleRoutineTask('${task.id}')" class="check-pop w-6 h-6 rounded-lg border-2 flex items-center justify-center shrink-0 transition ${task.completed ? 'bg-indigo-500 border-indigo-500 text-white' : 'border-slate-600 hover:border-indigo-400'}">
            ${task.completed ? '<i data-lucide="check" class="w-4 h-4 stroke-[3]"></i>' : ''}
          </button>
          <div class="flex-1 min-w-0">
            <p class="text-sm break-words ${task.completed ? 'line-through text-slate-500' : 'text-slate-100 font-medium'}">${escapeHtml(task.title)}</p>
          </div>
          <span class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-indigo-500/15 text-indigo-300 border border-indigo-500/20 shrink-0">${escapeHtml(task.frequency)}</span>
          <div class="flex items-center gap-0.5 shrink-0">
            <button onclick="openCalendarSyncModal('routine', '${task.id}')" class="p-1.5 text-slate-400 hover:text-emerald-400 rounded-lg hover:bg-slate-800 transition" title="カレンダー連携">
              <i data-lucide="calendar-plus" class="w-3.5 h-3.5"></i>
            </button>
            ${showDelete ? `
              <button onclick="deleteRoutineTask('${task.id}')" class="p-1.5 text-slate-400 hover:text-rose-400 rounded-lg hover:bg-slate-800 transition" title="削除">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }

    // ==========================================
    // 3. 休み管理画面レンダリング
    // ==========================================
    function switchLeaveViewMode(mode) {
      currentLeaveViewMode = mode;
      renderCurrentView();
    }

    function changeCalendarMonth(delta) {
      calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth() + delta, 1);
      renderCurrentView();
    }

    function renderLeavesView() {
      const todayStr = getOffsetDateStr(0);
      const usedPaidDays = appState.leaves
        .filter(l => l.type.includes('有給') || l.type.includes('半休'))
        .reduce((sum, l) => sum + Number(l.days || 0), 0);
      const remainingPaidDays = Math.max(0, (appState.totalPaidLeaveDays - usedPaidDays)).toFixed(1).replace(/\.0$/, '');
      const usedFormatted = usedPaidDays.toFixed(1).replace(/\.0$/, '');

      const sortedLeaves = [...appState.leaves].sort((a, b) => b.date.localeCompare(a.date));
      const isCal = currentLeaveViewMode === 'calendar';

      return `
        <!-- 有給残日数ダッシュボード -->
        <div class="bg-gradient-to-br from-[#1e293b] to-slate-900 border border-slate-700/80 rounded-2xl p-4 shadow-lg relative overflow-hidden">
          <div class="flex items-start justify-between">
            <div>
              <p class="text-xs font-medium text-slate-400">有給休暇 残り日数</p>
              <div class="flex items-baseline gap-1.5 mt-1">
                <span class="text-3xl font-bold text-emerald-400 tracking-tight">${remainingPaidDays}</span>
                <span class="text-sm font-medium text-slate-300">日</span>
                <span class="text-xs text-slate-500 ml-1">/ 年間付与 ${appState.totalPaidLeaveDays}日</span>
              </div>
            </div>
            <button onclick="openEditTotalLeaveModal()" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 border border-slate-700 flex items-center gap-1 transition">
              <i data-lucide="sliders-horizontal" class="w-3 h-3"></i>
              <span>付与日数設定</span>
            </button>
          </div>
          <div class="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
            <span>消化・予定合計: <strong class="text-slate-200">${usedFormatted}日</strong></span>
            <span>※半休は0.5日として自動計算</span>
          </div>
        </div>

        <!-- 表示切り替えタブ（リスト / カレンダー） -->
        <div class="bg-slate-900/90 p-1 rounded-2xl border border-slate-800 grid grid-cols-2 gap-1">
          <button onclick="switchLeaveViewMode('list')" class="py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 ${!isCal ? 'bg-[#1e293b] text-emerald-400 shadow-sm border border-slate-700/70' : 'text-slate-400 hover:text-slate-200'}">
            <i data-lucide="list" class="w-3.5 h-3.5"></i>
            <span>リスト・登録</span>
          </button>
          <button onclick="switchLeaveViewMode('calendar')" class="py-2 px-3 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 ${isCal ? 'bg-[#1e293b] text-emerald-400 shadow-sm border border-slate-700/70' : 'text-slate-400 hover:text-slate-200'}">
            <i data-lucide="calendar-days" class="w-3.5 h-3.5"></i>
            <span>月間カレンダー確認</span>
          </button>
        </div>

        ${isCal ? renderMiniScheduleCalendar() : `
          <!-- 休み登録フォーム -->
          <form onsubmit="handleAddLeave(event)" class="bg-[#1e293b]/90 border border-slate-800 rounded-2xl p-3.5 space-y-3 shadow-sm">
            <h3 class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
              <i data-lucide="calendar-plus" class="w-3.5 h-3.5 text-emerald-400"></i>
              <span>休みの予定・実績を登録</span>
            </h3>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] text-slate-400 mb-1 ml-1">日付</label>
                <input type="date" id="leave-date" required value="${getOffsetDateStr(7)}"
                  class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-400">
              </div>
              <div>
                <label class="block text-[10px] text-slate-400 mb-1 ml-1">休みの種類</label>
                <select id="leave-type" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-400">
                  <option value="有給休暇|1.0">有給休暇 (1.0日)</option>
                  <option value="半休（午前）|0.5">半休・午前 (0.5日)</option>
                  <option value="半休（午後）|0.5">半休・午後 (0.5日)</option>
                  <option value="代休・振休|0">代休・振休 (有給消費なし)</option>
                  <option value="特別休暇|0">特別・夏季休暇 (消費なし)</option>
                </select>
              </div>
            </div>
            <div>
              <input type="text" id="leave-memo" placeholder="一言メモ（例：通院、リフレッシュ、旅行など）" 
                class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3.5 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-400">
            </div>
            <button type="submit" class="w-full bg-emerald-400 hover:bg-emerald-300 active:scale-[0.99] text-slate-950 font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-1.5 shadow-md shadow-emerald-500/15">
              <i data-lucide="plus" class="w-4 h-4 stroke-[2.5]"></i>
              <span>休みを記録する</span>
            </button>
          </form>

          <!-- 休み履歴・予定一覧 -->
          <div class="space-y-2">
            <h3 class="text-xs font-semibold text-slate-400 px-1">登録済みの休み一覧 (${sortedLeaves.length}件)</h3>
            ${sortedLeaves.length > 0 ? sortedLeaves.map(leave => {
              const isFuture = leave.date >= todayStr;
              return `
                <div class="bg-[#1e293b]/80 border border-slate-700/70 rounded-2xl p-3 flex items-center justify-between gap-3">
                  <div class="flex items-center gap-3 min-w-0">
                    <div class="w-11 h-11 rounded-xl ${isFuture ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30' : 'bg-slate-800 text-slate-400'} flex flex-col items-center justify-center shrink-0">
                      <span class="text-[10px] font-bold leading-none">${leave.date.split('-')[1]}月</span>
                      <span class="text-base font-bold leading-tight">${Number(leave.date.split('-')[2])}</span>
                    </div>
                    <div class="min-w-0">
                      <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="text-sm font-bold text-slate-100">${escapeHtml(leave.type)}</span>
                        <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold ${isFuture ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-700 text-slate-400'}">
                          ${isFuture ? '取得予定' : '取得済み'}
                        </span>
                      </div>
                      <p class="text-xs text-slate-400 truncate mt-0.5">${leave.memo ? escapeHtml(leave.memo) : 'メモなし'}</p>
                    </div>
                  </div>
                  <div class="flex items-center gap-1 shrink-0">
                    <button onclick="openCalendarSyncModal('leave', '${leave.id}')" class="p-2 text-slate-400 hover:text-emerald-400 rounded-lg hover:bg-slate-800 transition" title="カレンダー連携">
                      <i data-lucide="calendar-plus" class="w-4 h-4"></i>
                    </button>
                    <button onclick="deleteLeave('${leave.id}')" class="p-2 text-slate-400 hover:text-rose-400 rounded-lg hover:bg-slate-800 transition" title="削除">
                      <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>
              `;
            }).join('') : `
              <div class="text-center py-6 text-xs text-slate-500 bg-slate-900/40 rounded-2xl border border-slate-800/60">登録されている休みはありません</div>
            `}
          </div>
        `}
      `;
    }

    // ミニ月間カレンダー描画（休み＆タスク期限を一覧表示）
    function renderMiniScheduleCalendar() {
      const year = calendarViewDate.getFullYear();
      const month = calendarViewDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = getOffsetDateStr(0);
      const weekHeaders = ['日', '月', '火', '水', '木', '金', '土'];

      let cellsHtml = '';
      for (let i = 0; i < firstDay; i++) {
        cellsHtml += `<div class="h-14 rounded-xl bg-slate-900/30"></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayLeaves = appState.leaves.filter(l => l.date === dateStr);
        const dayTasks = appState.spotTasks.filter(t => t.dueDate === dateStr && !t.completed);
        const isToday = dateStr === todayStr;

        cellsHtml += `
          <div class="h-14 rounded-xl p-1 flex flex-col justify-between border ${isToday ? 'border-sky-400 bg-sky-500/10' : dayLeaves.length > 0 ? 'border-emerald-500/40 bg-emerald-500/10' : 'border-slate-800/80 bg-slate-900/60'}">
            <span class="text-[11px] font-bold ${isToday ? 'text-sky-300' : 'text-slate-300'} leading-none">${d}</span>
            <div class="space-y-0.5 overflow-hidden">
              ${dayLeaves.length > 0 ? `<div class="text-[9px] font-bold px-1 rounded bg-emerald-500/30 text-emerald-200 truncate">休</div>` : ''}
              ${dayTasks.length > 0 ? `<div class="text-[9px] font-bold px-1 rounded bg-amber-500/30 text-amber-200 truncate">残${dayTasks.length}</div>` : ''}
            </div>
          </div>
        `;
      }

      const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      const monthLeaves = appState.leaves.filter(l => l.date.startsWith(monthPrefix)).sort((a, b) => a.date.localeCompare(b.date));
      const monthTasks = appState.spotTasks.filter(t => t.dueDate && t.dueDate.startsWith(monthPrefix) && !t.completed).sort((a, b) => a.dueDate.localeCompare(b.dueDate));

      return `
        <div class="bg-[#1e293b]/90 border border-slate-800 rounded-2xl p-3.5 space-y-3">
          <div class="flex items-center justify-between">
            <button onclick="changeCalendarMonth(-1)" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <h3 class="text-sm font-bold text-slate-100">${year}年 ${month + 1}月</h3>
            <button onclick="changeCalendarMonth(1)" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="grid grid-cols-7 gap-1 text-center">
            ${weekHeaders.map((w, idx) => `<span class="text-[10px] font-bold ${idx === 0 ? 'text-rose-400' : idx === 6 ? 'text-sky-400' : 'text-slate-400'}">${w}</span>`).join('')}
          </div>
          <div class="grid grid-cols-7 gap-1">
            ${cellsHtml}
          </div>
          <div class="flex items-center justify-end gap-3 text-[10px] text-slate-400 pt-1">
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400"></span>休み予定</span>
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-400"></span>変動タスク期限</span>
          </div>
        </div>

        <div class="space-y-2">
          <h4 class="text-xs font-semibold text-slate-400 px-1">${month + 1}月の予定サマリー</h4>
          ${monthLeaves.length === 0 && monthTasks.length === 0 ? `
            <div class="text-center py-5 text-xs text-slate-500 bg-slate-900/40 rounded-2xl border border-slate-800/60">この月の予定はありません</div>
          ` : `
            ${monthLeaves.map(l => `
              <div class="bg-[#1e293b]/70 border border-emerald-500/25 rounded-xl px-3 py-2.5 flex items-center justify-between text-xs">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="font-bold text-emerald-400 shrink-0">${formatDisplayDate(l.date)}</span>
                  <span class="text-slate-100 font-medium truncate">${escapeHtml(l.type)} ${l.memo ? `(${escapeHtml(l.memo)})` : ''}</span>
                </div>
                <button onclick="openCalendarSyncModal('leave', '${l.id}')" class="text-emerald-400 hover:text-emerald-300 p-1 shrink-0" title="外部カレンダーへ送る">
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            `).join('')}
            ${monthTasks.map(t => `
              <div class="bg-[#1e293b]/70 border border-amber-500/25 rounded-xl px-3 py-2.5 flex items-center justify-between text-xs">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="font-bold text-amber-400 shrink-0">${formatDisplayDate(t.dueDate)}</span>
                  <span class="text-slate-100 truncate">${escapeHtml(t.title)}</span>
                </div>
                <button onclick="openCalendarSyncModal('spot', '${t.id}')" class="text-sky-400 hover:text-sky-300 p-1 shrink-0" title="外部カレンダーへ送る">
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            `).join('')}
          `}
        </div>
      `;
    }

    // ==========================================
    // 4. メモ画面レンダリング（タスク変換付き）
// ... existing code ... -->
    // ==========================================
    // アクションハンドラ（CRUD操作）
    // ==========================================
    // カレンダー連携モーダル（Googleカレンダー / 標準カレンダー.ics選択）
    function getCalendarItemPayload(category, id) {
      if (category === 'spot') {
        const task = appState.spotTasks.find(t => t.id === id);
        if (!task) return null;
        const pLabel = { high: '高', medium: '中', low: '低' }[task.priority || 'medium'];
        return {
          title: `【仕事】${task.title}`,
          dateStr: task.dueDate || getOffsetDateStr(0),
          details: `WorkFlow 変動タスク（優先度: ${pLabel}）`,
          rrule: ''
        };
      } else if (category === 'leave') {
        const leave = appState.leaves.find(l => l.id === id);
        if (!leave) return null;
        return {
          title: `【休み】${leave.type}`,
          dateStr: leave.date || getOffsetDateStr(0),
          details: leave.memo ? `メモ: ${leave.memo}` : 'WorkFlow 休暇予定',
          rrule: ''
        };
      } else if (category === 'routine') {
        const rt = appState.routineTasks.find(t => t.id === id);
        if (!rt) return null;
        const freqMap = {
          '毎日': 'RRULE:FREQ=DAILY',
          '平日のみ': 'RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR',
          '隔週': 'RRULE:FREQ=WEEKLY;INTERVAL=2',
          '毎週月曜': 'RRULE:FREQ=WEEKLY;BYDAY=MO',
          '毎週火曜': 'RRULE:FREQ=WEEKLY;BYDAY=TU',
          '毎週水曜': 'RRULE:FREQ=WEEKLY;BYDAY=WE',
          '毎週木曜': 'RRULE:FREQ=WEEKLY;BYDAY=TH',
          '毎週金曜': 'RRULE:FREQ=WEEKLY;BYDAY=FR',
          '毎週土曜': 'RRULE:FREQ=WEEKLY;BYDAY=SA',
          '毎週日曜': 'RRULE:FREQ=WEEKLY;BYDAY=SU',
          '毎月1日': 'RRULE:FREQ=MONTHLY;BYMONTHDAY=1',
          '毎月15日': 'RRULE:FREQ=MONTHLY;BYMONTHDAY=15',
          '毎月25日': 'RRULE:FREQ=MONTHLY;BYMONTHDAY=25',
          '月末': 'RRULE:FREQ=MONTHLY;BYMONTHDAY=-1'
        };
        return {
          title: `【ルーティン】${rt.title}`,
          dateStr: getOffsetDateStr(0),
          details: `WorkFlow 決まっているタスク（頻度: ${rt.frequency}）`,
          rrule: freqMap[rt.frequency] || ''
        };
      }
      return null;
    }

    function openCalendarSyncModal(category, id) {
      const payload = getCalendarItemPayload(category, id);
      if (!payload) return;

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="calendar-plus" class="w-4 h-4 text-emerald-400"></i>
              <h3 class="text-base font-bold text-slate-100">カレンダーに予定を送る</h3>
            </div>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <div class="bg-slate-900/90 border border-slate-700 rounded-xl p-3 space-y-1 text-xs">
            <p class="font-bold text-slate-100">${escapeHtml(payload.title)}</p>
            <p class="text-slate-400">基準日: ${formatDisplayDate(payload.dateStr)} (${payload.dateStr})</p>
            ${payload.rrule ? `<p class="text-indigo-300 text-[11px]">※繰り返し設定も自動で引き継がれます</p>` : ''}
          </div>
          <div class="space-y-2">
            <button onclick="launchGoogleCalendar('${category}', '${id}')" class="w-full min-h-[44px] py-2.5 px-3 rounded-xl text-xs font-bold text-slate-950 bg-emerald-400 hover:bg-emerald-300 flex items-center justify-center gap-2 transition">
              <i data-lucide="external-link" class="w-4 h-4"></i>
              <span>Googleカレンダーで開く</span>
            </button>
            <button onclick="downloadIcsEvent('${category}', '${id}')" class="w-full min-h-[44px] py-2.5 px-3 rounded-xl text-xs font-semibold text-slate-200 bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center gap-2 transition">
              <i data-lucide="smartphone" class="w-4 h-4 text-sky-400"></i>
              <span>iPhone / 標準カレンダー用ファイル (.ics)</span>
            </button>
          </div>
          <p class="text-[10px] text-slate-400 leading-relaxed">
            ※カレンダーアプリ側で保存する際に「10分前」「前日」などの通知を設定できます。
          </p>
        </div>
      `);
    }

    function launchGoogleCalendar(category, id) {
      const payload = getCalendarItemPayload(category, id);
      if (!payload) return;

      const startCompact = payload.dateStr.replace(/-/g, '');
      const nextDayObj = new Date(payload.dateStr + 'T00:00:00');
      nextDayObj.setDate(nextDayObj.getDate() + 1);
      const endCompact = `${nextDayObj.getFullYear()}${String(nextDayObj.getMonth() + 1).padStart(2, '0')}${String(nextDayObj.getDate()).padStart(2, '0')}`;

      let url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(payload.title)}&dates=${startCompact}/${endCompact}&details=${encodeURIComponent(payload.details)}`;
      if (payload.rrule) {
        url += `&recur=${encodeURIComponent(payload.rrule)}`;
      }
      closeModal();
      window.open(url, '_blank', 'noopener');
    }

    function downloadIcsEvent(category, id) {
      const payload = getCalendarItemPayload(category, id);
      if (!payload) return;

      const startCompact = payload.dateStr.replace(/-/g, '');
      const nextDayObj = new Date(payload.dateStr + 'T00:00:00');
      nextDayObj.setDate(nextDayObj.getDate() + 1);
      const endCompact = `${nextDayObj.getFullYear()}${String(nextDayObj.getMonth() + 1).padStart(2, '0')}${String(nextDayObj.getDate()).padStart(2, '0')}`;
      const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

      const lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//WorkFlow//Personal Manager//JP',
        'BEGIN:VEVENT',
        `UID:${Date.now()}@workflow.local`,
        `DTSTAMP:${stamp}`,
        `DTSTART;VALUE=DATE:${startCompact}`,
        `DTEND;VALUE=DATE:${endCompact}`,
        `SUMMARY:${payload.title}`,
        `DESCRIPTION:${payload.details}`
      ];
      if (payload.rrule) {
        lines.push(payload.rrule);
      }
      lines.push('END:VEVENT', 'END:VCALENDAR');

      const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `workflow_event_${startCompact}.ics`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      closeModal();
      showToast('カレンダー登録用ファイル(.ics)を作成しました');
    }

    // 互換用エイリアス
    function addToGoogleCalendar(category, id) {
      openCalendarSyncModal(category, id);
    }
